name: Happy5
description: Happy5 is a Jakarta-based employee performance management platform, operated
  by Happy5 For The World Pte. Ltd. and founded in 2013, that unifies goal and OKR
  management, project tracking, and 360-degree performance reviews in one tool for
  HR teams. It automatically surfaces the goals hit, projects delivered, and milestones
  completed inside every performance review, and integrates with tools teams already
  use such as Jira, Asana, Slack, and Google Sheets. Its customers span major Indonesian
  banks, startups, and SMEs. Happy5 is a closed SaaS product and does not publish a
  public developer API, OpenAPI definition, or client SDKs; this profile captures its
  verified public identity and web properties as a lead.
